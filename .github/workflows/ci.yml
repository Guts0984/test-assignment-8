name: ci
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build --workspace @helpdesk/shared
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
  # Later blocks add: api integration (postgres service), web unit, e2e on the compose stack.
