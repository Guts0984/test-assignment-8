name: ci
on: [push, pull_request]

# Every concern is its own job: they run in parallel and fail (and get re-run) independently.
env:
  PG_USER: helpdesk
  PG_PASSWORD: helpdesk_ci_password

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { build: 'true' }
      - run: pnpm typecheck

  build:
    name: build (shared · db · api · web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm build
      # a real production build catches what the typechecker cannot (routes, i18n plugin, config)
      - run: pnpm --filter @helpdesk/web build

  migrations:
    name: migrations are in sync with the schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm db:check-drift

  nginx-config:
    name: nginx config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: nginx -t (upstream names resolved to localhost)
        run: docker run --rm --add-host web:127.0.0.1 --add-host api:127.0.0.1 -v "$PWD/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.27-alpine nginx -t

  test-shared:
    name: tests · shared
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { build: 'true' }
      - run: pnpm --loglevel=info --filter @helpdesk/shared test

  test-web:
    name: tests · web (unit, MSW, axe, hydration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { build: 'true' }
      - run: pnpm --loglevel=info --filter @helpdesk/web test

  test-db:
    name: tests · db (real PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          {
            POSTGRES_USER: helpdesk,
            POSTGRES_PASSWORD: helpdesk_ci_password,
            POSTGRES_DB: helpdesk,
          }
        ports: ['5440:5432']
        options: >-
          --health-cmd "pg_isready -U helpdesk" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_ADMIN_DATABASE_URL: postgres://helpdesk:helpdesk_ci_password@localhost:5440/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { build: 'true' }
      - run: pnpm --loglevel=info --filter @helpdesk/db test

  test-api:
    name: tests · api (real server, real PostgreSQL, attack suite, nginx layer)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          {
            POSTGRES_USER: helpdesk,
            POSTGRES_PASSWORD: helpdesk_ci_password,
            POSTGRES_DB: helpdesk,
          }
        ports: ['5440:5432']
        options: >-
          --health-cmd "pg_isready -U helpdesk" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_ADMIN_DATABASE_URL: postgres://helpdesk:helpdesk_ci_password@localhost:5440/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { build: 'true' }
      # the nginx-layer tests run the real nginx image with host networking
      - run: docker pull nginx:1.27-alpine
      - run: pnpm --loglevel=info --filter @helpdesk/api test

  # One job per browser: they run in parallel and fail independently.
  e2e:
    name: e2e (${{ matrix.browser }})
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Start the stack through nginx on :8080 (the only manual step of the project is the .env copy)
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build --wait
      - name: Install ${{ matrix.browser }}
        run: pnpm --filter @helpdesk/e2e exec playwright install --with-deps ${{ matrix.browser }}
      - name: Run the e2e suite in ${{ matrix.browser }}
        run: pnpm --loglevel=info --filter @helpdesk/e2e exec playwright test --project=${{ matrix.browser }}
      - name: Collect logs
        if: failure()
        run: docker compose logs --no-color > compose.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-${{ matrix.browser }}
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
            compose.log
          retention-days: 7
      - if: always()
        run: docker compose down -v
