name: ci
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: helpdesk
          POSTGRES_PASSWORD: helpdesk_ci_password
          POSTGRES_DB: helpdesk
        ports: ['5440:5432']
        options: >-
          --health-cmd "pg_isready -U helpdesk" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://helpdesk:helpdesk_ci_password@localhost:5440/helpdesk
      TEST_ADMIN_DATABASE_URL: postgres://helpdesk:helpdesk_ci_password@localhost:5440/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm --loglevel=info install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      # a real production build catches what the typechecker cannot (routes, i18n plugin, config)
      - run: pnpm --filter @helpdesk/web build
      # schema.ts and the committed migrations must not drift apart
      - run: pnpm db:check-drift
      # full output on purpose: when a test fails, the log must say which one
      - run: pnpm test:verbose
  # Later blocks add: api integration + hostile-client suite, web unit, e2e on the compose stack.
