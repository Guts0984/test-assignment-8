# Cold start:  cp .env.example .env && docker compose up --build
# nginx is the only published service: http://localhost:8080 → web, http://localhost:8080/api → api.
# The api applies migrations and seeds demo data on boot.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '127.0.0.1:${POSTGRES_PORT}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file: .env
    environment:
      # inside the compose network the database is `postgres:5432`, not localhost
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NODE_ENV: production
      PORT: 3001
      # a plain-http local run: browsers drop Secure cookies on http://localhost in some setups
      COOKIE_SECURE: 'false'
      UPLOADS_DIR: /data/uploads
      # ONLY nginx (fixed address below) is trusted to say who the client is. Trusting whole private ranges would make every
      # LAN/VPN/Docker-host client look like a proxy and fold them into one rate-limit bucket.
      TRUSTED_PROXIES: 172.30.77.10
      CORS_ORIGINS: http://localhost:${PUBLIC_PORT:-8080}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 90s
    volumes:
      - uploads:/data/uploads
    stop_grace_period: 15s

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  nginx:
    image: nginx:1.27-alpine
    networks:
      default:
        ipv4_address: 172.30.77.10
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '${PUBLIC_PORT:-8080}:8080'
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/api/health']
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.77.0/24

volumes:
  pgdata:
  uploads:
