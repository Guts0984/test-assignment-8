# Everything on one port: web at /, the api at /api (and its Swagger at /docs).
upstream web { server web:3000; keepalive 16; }
upstream api { server api:3001; keepalive 16; }

# Never pass on a client-supplied X-Forwarded-For: the api trusts THIS proxy, so what we send is the truth.
map $http_upgrade $connection_upgrade { default upgrade; '' ''; }

# HSTS only when a TLS terminator in front of this nginx says the client came over https (an empty value is not sent).
map $http_x_forwarded_proto $hsts { https "max-age=31536000; includeSubDomains"; default ""; }

server {
  listen 8080;
  server_name _;
  server_tokens off;
  add_header Strict-Transport-Security $hsts always;

  # uploads are limited to 10 MB by the api (exact, by content); this only stops absurd bodies early
  client_max_body_size 11m;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection "";

  location = /api { return 301 /api/; }

  # /api/foo → api:3001/foo  (the trailing slash strips the prefix). SSE (/api/events) needs buffering off.
  location /api/ {
    proxy_pass http://api/;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # Swagger UI (it links to its assets under /docs)
  location ~ ^/(docs|docs-json)(/|$) {
    proxy_pass http://api;
  }

  location / {
    proxy_pass http://web;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
